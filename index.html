<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة كوتش AI الطبية | الامتحان الوطني في سوريا</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Arabic Fonts (Cairo) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        cairo: ['Cairo', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background: linear-gradient(135deg, #070b14 0%, #111827 50%, #064e3b 100%);
            min-height: 100vh;
            color: #f8fafc;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
        }

        .bg-blob {
            position: fixed;
            border-radius: 50%;
            filter: blur(100px);
            z-index: -1;
            opacity: 0.25;
        }
    </style>
</head>
<body class="flex items-center justify-center p-4 min-h-screen relative overflow-x-hidden">

    <!-- Background Blobs -->
    <div class="bg-blob w-[400px] h-[400px] bg-teal-500 top-10 right-10"></div>
    <div class="bg-blob w-[400px] h-[400px] bg-emerald-700 bottom-10 left-10"></div>

    <div class="w-full max-w-md glass-panel rounded-3xl p-6 sm:p-8 relative z-10 text-center">
        
        <!-- Logo Header -->
        <div class="mb-6 flex justify-center">
            <div class="w-16 h-16 rounded-2xl bg-emerald-500/20 border border-emerald-400/40 flex items-center justify-center text-emerald-400 text-3xl shadow-lg">
                <i class="fa-solid fa-user-doctor"></i>
            </div>
        </div>

        <h1 class="text-2xl sm:text-3xl font-black text-white mb-2">منصة كوتش AI الطبية 🩺</h1>
        <p class="text-slate-300 text-xs sm:text-sm mb-6 leading-relaxed">
            مساعدك الذكي المخصص لاجتياز **الامتحان الوطني للطب البشري في سوريا**. سجل الآن لتسريع تحضيرك وااختبار النظام!
        </p>

        <!-- Registration Form -->
        <form id="registerForm" onsubmit="handleRegistration(event)" class="space-y-4 text-right">
            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1">الاسم الكامل *</label>
                <input type="text" id="fullName" required placeholder="د. أحمد الخالد" 
                    class="w-full px-4 py-2.5 rounded-xl bg-white/5 border border-white/10 text-white placeholder-slate-500 focus:outline-none focus:border-emerald-400 transition text-sm">
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1">البريد الإلكتروني *</label>
                <input type="email" id="email" required placeholder="doctor@example.com" 
                    class="w-full px-4 py-2.5 rounded-xl bg-white/5 border border-white/10 text-white placeholder-slate-500 focus:outline-none focus:border-emerald-400 transition text-sm">
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">الجامعة *</label>
                    <select id="university" required class="w-full px-3 py-2.5 rounded-xl bg-slate-900/90 border border-white/10 text-white text-xs focus:outline-none focus:border-emerald-400">
                        <option value="جامعة دمشق">جامعة دمشق</option>
                        <option value="جامعة حلب">جامعة حلب</option>
                        <option value="جامعة تشرين">جامعة تشرين</option>
                        <option value="جامعة البعث">جامعة البعث</option>
                        <option value="جامعة حماة">جامعة حماة</option>
                        <option value="جامعة القلمون">جامعة القلمون</option>
                        <option value="جامعة الأندلس">جامعة الأندلس</option>
                        <option value="جامعة خريجة / أخرى">جامعة أخرى / خارج سوريا</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">رقم الواتساب (اختياري)</label>
                    <input type="tel" id="whatsapp" placeholder="09xxxxxxxx" 
                        class="w-full px-3 py-2.5 rounded-xl bg-white/5 border border-white/10 text-white placeholder-slate-500 focus:outline-none focus:border-emerald-400 transition text-sm">
                </div>
            </div>

            <button type="submit" id="submitBtn" 
                class="w-full mt-2 py-3 px-4 rounded-xl bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold text-sm transition duration-200 flex items-center justify-center gap-2 shadow-lg">
                <i class="fa-solid fa-paper-plane"></i>
                <span>تأكيد التسجيل والانضمام</span>
            </button>
        </form>

        <!-- Dynamic Success & Action Panel (Hidden by default) -->
        <div id="successPanel" class="hidden space-y-4 mt-2">
            <div class="p-4 rounded-xl bg-emerald-500/20 border border-emerald-400/40 text-emerald-300 text-xs sm:text-sm font-bold flex items-center justify-center gap-2">
                <i class="fa-solid fa-circle-check text-lg"></i>
                <span>تم تسجيلك بنجاح في منصة كوتش AI! 🎉</span>
            </div>

            <p class="text-xs text-slate-300">
                سيتم تحويلك تلقائياً للاستبيان خلال <span id="countdown" class="font-bold text-emerald-400 text-sm">10</span> ثوانٍ...
            </p>

            <!-- Navigation Buttons -->
            <div class="space-y-2 pt-2">
                <button type="button" onclick="goToPage('./survey/index.html')" class="w-full py-3 px-4 rounded-xl bg-gradient-to-r from-sky-600 to-teal-600 hover:from-sky-500 hover:to-teal-500 text-white font-bold text-sm transition duration-200 flex items-center justify-center gap-2 shadow-md">
                    <i class="fa-solid fa-clipboard-list"></i>
                    <span>الانتقال للاستبيان الطبي الشامل</span>
                </button>

                <button type="button" onclick="goToPage('./chat/index.html')" class="w-full py-3 px-4 rounded-xl bg-white/10 hover:bg-white/20 border border-white/20 text-white font-bold text-sm transition duration-200 flex items-center justify-center gap-2">
                    <i class="fa-solid fa-comments text-emerald-400"></i>
                    <span>تخطي والبدء بالدردشة مع كوتش AI 💬</span>
                </button>
            </div>
        </div>

        <footer class="mt-6 pt-4 border-t border-white/10 text-[11px] text-slate-400">
            جميع الحقوق محفوظة © منصة كوتش AI 2026
        </footer>
    </div>

    <script>
        // Supabase Credentials Config
        const SUPABASE_URL = "https://kwvctwyydqrooqrwzssn.supabase.co"; 
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt3dmN0d3l5ZHFyb29xcnd6c3NuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEyMjcyNTEsImV4cCI6MjEwNjgwMzI1MX0.9TdOHBb6AkN8QmYmzqQx8rmctQvhmnAvLyinv0Sy-oE"; 
        
        let _supabase = null;
        if (SUPABASE_URL.includes("http") && !SUPABASE_URL.includes("YOUR_SUPABASE")) {
            _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        }

        let redirectInterval = null;

        // دالة التوجيه الآمن وإيقاف المؤقت
        function goToPage(url) {
            if (redirectInterval) {
                clearInterval(redirectInterval);
            }
            window.location.href = url;
        }

        async function handleRegistration(e) {
            e.preventDefault();
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> جاري الحفظ...`;

            const userData = {
                full_name: document.getElementById('fullName').value,
                email: document.getElementById('email').value,
                university: document.getElementById('university').value,
                whatsapp: document.getElementById('whatsapp').value || null,
                created_at: new Date().toISOString()
            };

            // Save to LocalStorage
            localStorage.setItem('coach_user', JSON.stringify(userData));

            // Save to Supabase (if connected)
            if (_supabase) {
                try {
                    await _supabase.from('subscribers').insert([userData]);
                } catch (err) {
                    console.warn("Supabase insert note:", err);
                }
            }

            // Hide Form & Display Success Panel with Action Buttons
            document.getElementById('registerForm').classList.add('hidden');
            document.getElementById('successPanel').classList.remove('hidden');

            // Start 10-second auto-redirect timer
            let secondsLeft = 10;
            const countdownEl = document.getElementById('countdown');
            
            if (redirectInterval) clearInterval(redirectInterval);

            redirectInterval = setInterval(() => {
                secondsLeft--;
                if (countdownEl) countdownEl.innerText = secondsLeft;
                if (secondsLeft <= 0) {
                    clearInterval(redirectInterval);
                    window.location.href = './survey/index.html'; // Redirect to Survey on timeout
                }
            }, 1000);
        }
    </script>
</body>
</html>
